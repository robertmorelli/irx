# irx target: regex-automata backtrack (bounded backtracker)
# Run: tools/irx_target.py ra-backtrack [--duration SECONDS]

[target]
title = "regex-automata 0.4 backtrack"
kind = "shell"   # d8 | perl | shell
command = "{root}/hosts/bin/automata_host {mode}"
env = "IRX_RA_ENGINE=backtrack"
dialect = "rust"   # src/dialects/
selfcheck = true

[span]
enabled = true
units = "utf8"  # index unit of the host's reported spans

[capture]
enabled = true
loop = "keep"  # loop bodies' captures per iteration (docs/phase2-captures.md)
lookbehind = false  # lookbehind runs forward here; JS (and the model) match it right to left

[offset]
enabled = true  # span of a search from a start offset (lastIndex / pos / start offset)
sticky = true  # Input::anchored(Anchored::Yes)

[global]
enabled = true  # find_iter: the first matches of a global search
