# irx target: PCRE2 10.49 (interpreter; IRX_PCRE2_JIT=1 for the JIT)
# Run: tools/irx_target.py pcre2 [--duration SECONDS]

[target]
title = "PCRE2 10.49 (interpreter; IRX_PCRE2_JIT=1 for the JIT)"
kind = "shell"   # d8 | perl | shell
command = "{root}/hosts/bin/pcre2_host {mode}"
dialect = "perl"   # src/dialects/
selfcheck = true

[span]
enabled = true
units = "utf8"  # index unit of the host's reported spans

[capture]
enabled = true
loop = "keep"  # loop bodies' captures per iteration (docs/phase2-captures.md)
