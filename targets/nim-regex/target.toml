# irx target: nim-regex
# Run: tools/irx_target.py nim-regex [--duration SECONDS]

[target]
title = "nim-regex"
kind = "shell"   # d8 | perl | shell
command = "{root}/hosts/bin/nim_host {mode}"
dialect = "nim"   # src/dialects/
selfcheck = true

[span]
enabled = true
units = "utf8"  # index unit of the host's reported spans

[capture]
enabled = true
loop = "keep"  # loop bodies' captures per iteration (docs/phase2-captures.md)
