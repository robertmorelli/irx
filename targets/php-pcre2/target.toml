# irx target: PHP 8.5 preg_* (PCRE2 + JIT)
# Run: tools/irx_target.py php-pcre2 [--duration SECONDS]

[target]
title = "PHP 8.5 preg_* (PCRE2 + JIT)"
kind = "shell"   # d8 | perl | shell
command = "/opt/homebrew/bin/php {root}/hosts/script/php_host.php {mode}"
dialect = "perl"   # src/dialects/
selfcheck = true

[span]
enabled = true
units = "utf8"  # index unit of the host's reported spans

[capture]
enabled = true
loop = "keep"  # loop bodies' captures per iteration (docs/phase2-captures.md)
