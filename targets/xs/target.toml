# irx target: XS (Moddable, jsvu)
# Run: tools/irx_target.py xs [--duration SECONDS]

[target]
title = "XS (Moddable, jsvu)"
kind = "shell"   # d8 | perl | shell
command = "/opt/homebrew/bin/python3 {root}/tools/bridge.py {root}/vendor/jsvu-home/.jsvu/bin/xs {driver} {mode}"
dialect = "es"   # src/dialects/
selfcheck = true

[span]
enabled = true
units = "utf16"  # index unit of the host's reported spans

[capture]
enabled = true
loop = "reset"  # loop bodies' captures per iteration (docs/phase2-captures.md)

[harness]
# tools/bridge.py splits a timed-out batch and reports a hanging case as unsupported;
# small batches and a long deadline leave room for that bisection.
batch_size = 64
batch_deadline_base_ms = 90000

[offset]
enabled = true  # span of a search from a start offset (lastIndex / pos / start offset)
