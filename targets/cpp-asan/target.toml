# irx target: C++ std::regex, libc++ (ASan/UBSan)
# Run: tools/irx_target.py cpp-asan [--duration SECONDS]

[target]
title = "C++ std::regex, libc++ (ASan/UBSan)"
kind = "shell"   # d8 | perl | shell
command = "{root}/hosts/bin/cpp_regex_host_asan {mode}"
env = "ASAN_OPTIONS=abort_on_error=1:halt_on_error=1:detect_leaks=0 UBSAN_OPTIONS=halt_on_error=1:abort_on_error=1:print_stacktrace=1"
dialect = "cpp"   # src/dialects/
selfcheck = true

[flags]
# std::regex has icase and multiline only (no dotall, no Unicode modes).
sets = ["", "i", "m", "im"]

[span]
enabled = true
units = "utf8"  # index unit of the host's reported spans

[capture]
enabled = true
loop = "reset"  # loop bodies' captures per iteration (docs/phase2-captures.md)

[harness]
# Sanitized builds run 2-5x slower.
batch_deadline_per512_ms = 8000
