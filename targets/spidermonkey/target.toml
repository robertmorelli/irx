# irx target: SpiderMonkey 158.0b5 (jsvu)
# Run: tools/irx_target.py spidermonkey [--duration SECONDS]

[target]
title = "SpiderMonkey 158.0b5 (jsvu)"
kind = "shell"   # d8 | perl | shell
command = "{root}/vendor/jsvu-home/.jsvu/bin/sm {driver} {mode}"
dialect = "es"   # src/dialects/
selfcheck = true

[span]
enabled = true
units = "utf16"  # index unit of the host's reported spans

[capture]
enabled = true
loop = "reset"  # loop bodies' captures per iteration (docs/phase2-captures.md)

[offset]
enabled = true  # span of a search from lastIndex
sticky = true   # the y flag
