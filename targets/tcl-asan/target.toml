# irx target: Tcl 9.1 (ASan/UBSan)
# Run: tools/irx_target.py tcl-asan [--duration SECONDS]

[target]
title = "Tcl 9.1 (ASan/UBSan)"
kind = "shell"   # d8 | perl | shell
command = "{root}/vendor/asan/tcl/bin/tclsh9.1 {root}/hosts/script/tcl_host.tcl {mode}"
env = "ASAN_OPTIONS=abort_on_error=1:halt_on_error=1:detect_leaks=0 UBSAN_OPTIONS=halt_on_error=1:abort_on_error=1:print_stacktrace=1"
dialect = "tcl"   # src/dialects/
selfcheck = true

[span]
enabled = true
units = "cp"  # index unit of the host's reported spans

[harness]
# Sanitized builds run 2-5x slower.
batch_deadline_per512_ms = 8000
