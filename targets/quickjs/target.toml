# irx target: QuickJS
# Run: tools/irx_target.py quickjs [--duration SECONDS]

[target]
title = "QuickJS"
kind = "shell"   # d8 | perl | shell
# Upstream source build (vendor/quickjs, bellard/quickjs 9d01a96): the Homebrew 2026-06-04 release
# still has IRX-QJS-1 (fixed upstream), which rejects every `v` pattern containing `-`.
command = "{root}/vendor/quickjs/bin/qjs --std {driver} {mode}"
dialect = "es"   # src/dialects/
selfcheck = true

[span]
enabled = true
units = "utf16"  # index unit of the host's reported spans

[capture]
enabled = true
loop = "reset"  # loop bodies' captures per iteration (docs/phase2-captures.md)

[offset]
enabled = true  # span of a search from a start offset (lastIndex / pos / start offset)
sticky = true

[global]
enabled = true  # first 4 matches of matchAll (JS empty-match advance)
