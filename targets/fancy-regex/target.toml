# irx target: fancy-regex
# Run: tools/irx_target.py fancy-regex [--duration SECONDS]

[target]
title = "fancy-regex"
kind = "shell"   # d8 | perl | shell
command = "{root}/hosts/bin/fancy_host {mode}"
dialect = "fancy"   # src/dialects/
selfcheck = true

[span]
enabled = true
units = "utf8"  # index unit of the host's reported spans

[capture]
enabled = true
loop = "keep"  # loop bodies' captures per iteration (docs/phase2-captures.md)
lookbehind = false  # lookbehind runs forward here; JS (and the model) match it right to left

[offset]
enabled = true  # span of a search from a start offset (lastIndex / pos / start offset)
sticky = true  # the match must start at the offset

[grammar]
# {254} over a large Unicode class next to \b or an alternative: "error building NFA" in the
# regex-automata delegate (delegate_size_limit does not cover it); 100 compiles.
big_rep_bounds = [16, 100]

[global]
enabled = true  # find_iter: the first matches of a global search
