# irx target: Perl 5.44 /aa
# Run: tools/irx_target.py perl-aa [--duration SECONDS]

[target]
title = "Perl 5.44 /aa"
kind = "perl"   # d8 | perl | shell
command = "/opt/homebrew/bin/perl"
env = "IRX_PERL_CHARSET=aa"   # set for irx and the engine processes (tools/irx_target.py)
dialect = "perl-aa"   # src/dialects/
selfcheck = true

[span]
enabled = true
units = "cp"  # index unit of the host's reported spans

[capture]
enabled = true
loop = "unmodeled"  # Perl >= 5.38 clears some (not all) loop captures per iteration; loop bodies' captures per iteration (docs/phase2-captures.md)
lookbehind = false  # lookbehind runs forward here; JS (and the model) match it right to left

[offset]
enabled = true  # span of a search from a start offset (lastIndex / pos / start offset)
sticky = true
