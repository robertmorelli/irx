# irx target: Rust regex
# Run: tools/irx_target.py rust-regex [--duration SECONDS]

[target]
title = "Rust regex"
kind = "shell"   # d8 | perl | shell
command = "{root}/hosts/bin/regex_host {mode}"
dialect = "perl"   # src/dialects/
selfcheck = true

# config overlay (merged over weights.toml)
[weights]
lookahead = 0
neg_lookahead = 0
lookbehind = 0
neg_lookbehind = 0
