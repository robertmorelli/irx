# irx target: PCRE2 10.49 JIT (pcre2_jit_compile; same host as pcre2)
# Run: tools/irx_target.py pcre2-jit [--duration SECONDS]

[target]
title = "PCRE2 10.49 JIT"
kind = "shell"   # d8 | perl | shell
command = "/usr/bin/env IRX_PCRE2_JIT=1 {root}/hosts/bin/pcre2_host {mode}"
dialect = "pcre2"   # src/dialects/
selfcheck = true

[span]
enabled = true
units = "utf8"  # index unit of the host's reported spans

[capture]
enabled = true
loop = "keep"  # loop bodies' captures per iteration (docs/phase2-captures.md)
lookbehind = false  # lookbehind runs forward here; JS (and the model) match it right to left

[offset]
enabled = true  # span of a search from a start offset
sticky = true   # PCRE2_ANCHORED at the offset
