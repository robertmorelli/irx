# irx target: JavaScriptCore (macOS system jsc)
# Run: tools/irx_target.py jsc [--duration SECONDS]

[target]
title = "JavaScriptCore (macOS system jsc)"
kind = "shell"   # d8 | perl | shell
command = "/System/Library/Frameworks/JavaScriptCore.framework/Versions/Current/Helpers/jsc {driver} -- {mode}"
dialect = "es"   # src/dialects/
selfcheck = true

[span]
enabled = true
units = "utf16"  # index unit of the host's reported spans

[capture]
enabled = true
loop = "reset"  # loop bodies' captures per iteration (docs/phase2-captures.md)

[offset]
enabled = true  # span of a search from lastIndex
sticky = true   # the y flag
