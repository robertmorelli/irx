# irx target: .NET 9 Regex (interpreter)
# Run: tools/irx_target.py dotnet-interp [--duration SECONDS]

[target]
title = ".NET 9 Regex (interpreter)"
kind = "shell"   # d8 | perl | shell
command = "{root}/hosts/bin/dotnet/host interp {mode}"
dialect = "dotnet"   # src/dialects/
selfcheck = true

[span]
enabled = true
units = "utf16"  # index unit of the host's reported spans

[capture]
enabled = true
loop = "keep"  # loop bodies' captures per iteration (docs/phase2-captures.md)
lookbehind = false  # lookbehind runs forward here; JS (and the model) match it right to left
