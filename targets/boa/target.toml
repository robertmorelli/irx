# irx target: Boa (boa_cli)
# Run: tools/irx_target.py boa [--duration SECONDS]

[target]
title = "Boa (boa_cli)"
kind = "shell"   # d8 | perl | shell
command = "/opt/homebrew/bin/python3 {root}/tools/bridge.py {root}/vendor/boa/bin/boa {driver} {mode}"
dialect = "es"   # src/dialects/
selfcheck = true

[span]
enabled = true
units = "utf16"  # index unit of the host's reported spans

[capture]
enabled = true
loop = "reset"  # loop bodies' captures per iteration (docs/phase2-captures.md)
