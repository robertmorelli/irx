# irx target: nim-regex (ASan/UBSan)
# Run: tools/irx_target.py nim-regex-asan [--duration SECONDS]

[target]
title = "nim-regex (ASan/UBSan)"
kind = "shell"   # d8 | perl | shell
command = "{root}/hosts/bin/nim_host_asan {mode}"
env = "ASAN_OPTIONS=abort_on_error=1:halt_on_error=1:detect_leaks=0 UBSAN_OPTIONS=halt_on_error=1:abort_on_error=1:print_stacktrace=1"
dialect = "nim"   # src/dialects/
selfcheck = true

[span]
enabled = true
units = "utf8"  # index unit of the host's reported spans

[capture]
enabled = true
loop = "keep"  # loop bodies' captures per iteration (docs/phase2-captures.md)
lookbehind = false  # lookbehind runs forward here; JS (and the model) match it right to left

[offset]
enabled = true  # span of a search from a start offset (lastIndex / pos / start offset)

[grammar]
big_rep_bounds = [16, 100]  # nim-regex rejects {m,n} with n > 100

[harness]
# Sanitized builds run 2-5x slower.
batch_deadline_per512_ms = 8000
