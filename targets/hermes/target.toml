# irx target: Hermes (jsvu)
# Run: tools/irx_target.py hermes [--duration SECONDS]

[target]
title = "Hermes (jsvu)"
kind = "shell"   # d8 | perl | shell
command = "/opt/homebrew/bin/python3.14 {root}/tools/bridge.py {root}/vendor/jsvu-home/.jsvu/bin/hermes {driver} {mode}"
dialect = "es"   # src/dialects/
selfcheck = false

# config overlay (merged over weights.toml)
[flags]
sets = ["", "i", "m", "s", "u", "iu", "im", "is", "ms", "ims", "imu", "isu", "msu", "imsu", "su", "mu"]

[span]
enabled = true
units = "utf16"  # index unit of the host's reported spans

[capture]
enabled = true
loop = "reset"  # loop bodies' captures per iteration (docs/phase2-captures.md)

[harness]
# tools/bridge.py splits a timed-out batch and reports a hanging case as unsupported;
# small batches and a long deadline leave room for that bisection.
batch_size = 64
batch_deadline_base_ms = 90000

[offset]
enabled = true  # span of a search from a start offset (lastIndex / pos / start offset)
sticky = true

[weights]
flag_group = 0  # no ES2025 modifiers: (?i:…) is a syntax error

[grammar]
duplicate_names = false  # (?<a>x)|(?<a>y) is a syntax error

[global]
enabled = true  # first 4 matches of matchAll (JS empty-match advance)
