# irx target: engine262
# Run: tools/irx_target.py engine262 [--duration SECONDS]

[target]
title = "engine262"
kind = "shell"   # d8 | perl | shell
command = "/opt/homebrew/bin/python3 {root}/tools/bridge.py {root}/vendor/node/node_modules/.bin/engine262 {driver} {mode}"
dialect = "es"   # src/dialects/
selfcheck = false

[span]
enabled = true
units = "utf16"  # index unit of the host's reported spans

[capture]
enabled = true
loop = "reset"  # loop bodies' captures per iteration (docs/phase2-captures.md)
