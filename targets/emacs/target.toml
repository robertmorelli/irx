# irx target: Emacs Lisp regexps (translated)
# Run: tools/irx_target.py emacs [--duration SECONDS]

[target]
title = "Emacs Lisp regexps (translated)"
kind = "shell"   # d8 | perl | shell
command = "/opt/homebrew/bin/emacs -Q --batch -l {root}/hosts/emacs/host.el {mode}"
dialect = "emacs"   # src/dialects/
selfcheck = true

[span]
enabled = true
units = "cp"  # index unit of the host's reported spans

[capture]
enabled = true
loop = "keep"  # loop bodies' captures per iteration (docs/phase2-captures.md)
lookbehind = false  # lookbehind runs forward here; JS (and the model) match it right to left
