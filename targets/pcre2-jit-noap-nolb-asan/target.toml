# irx target: PCRE2 10.49 JIT, no auto-possess, no lookbehind (ASan/UBSan)
# Run: tools/irx_target.py pcre2-jit-noap-nolb-asan [--duration SECONDS]
# Auto-possessification off (PCRE2_NO_AUTO_POSSESS): IRX-PCRE2-4 and -8 fire on most runs with it on.

[target]
title = "PCRE2 10.49 JIT, no auto-possess, no lookbehind (ASan/UBSan)"
kind = "shell"   # d8 | perl | shell
command = "{root}/hosts/bin/pcre2_host_asan {mode}"
env = "IRX_PCRE2_NOAP=1 IRX_PCRE2_JIT=1 ASAN_OPTIONS=abort_on_error=1:halt_on_error=1:detect_leaks=0 UBSAN_OPTIONS=halt_on_error=1:abort_on_error=1:print_stacktrace=1"
dialect = "pcre2"   # src/dialects/
selfcheck = true

[span]
enabled = true
units = "utf8"  # index unit of the host's reported spans

[capture]
enabled = true
loop = "keep"  # loop bodies' captures per iteration (docs/phase2-captures.md)
lookbehind = false  # lookbehind runs forward here; JS (and the model) match it right to left

[offset]
enabled = true  # span of a search from a start offset (lastIndex / pos / start offset)
sticky = true

[harness]
# Sanitized builds run 2-5x slower.
batch_deadline_per512_ms = 8000

[weights]
# The JIT gets a lookbehind next to \b, \B, $ or \z wrong (IRX-PCRE2-1), which buries every other
# JIT finding: no lookbehind here.
lookbehind = 0
neg_lookbehind = 0
