# irx target: V8 15.5 (d8)
# Run: tools/irx_target.py v8 [--duration SECONDS]

[target]
title = "V8 15.5 (d8)"
kind = "d8"   # d8 | perl | shell
command = "/opt/homebrew/bin/d8"
dialect = "es"   # src/dialects/
selfcheck = true

[span]
enabled = true
units = "utf16"  # index unit of the host's reported spans

[capture]
enabled = true
loop = "reset"  # loop bodies' captures per iteration (docs/phase2-captures.md)
