# irx target: ICU NSRegularExpression
# Run: tools/irx_target.py icu [--duration SECONDS]

[target]
title = "ICU NSRegularExpression"
kind = "shell"   # d8 | perl | shell
command = "{root}/hosts/bin/swift_host icu {mode}"
dialect = "icu"   # src/dialects/
selfcheck = true

[span]
enabled = true
units = "utf16"  # index unit of the host's reported spans

[capture]
enabled = true
loop = "keep"  # loop bodies' captures per iteration (docs/phase2-captures.md)
lookbehind = false  # lookbehind runs forward here; JS (and the model) match it right to left

[harness]
# hosts/swift abandons an ICU match after 50 ms (IRX-ICU-1 loops forever) and reports the
# case as unsupported; smaller batches with a longer deadline absorb those waits.
batch_size = 128
batch_deadline_base_ms = 30000
