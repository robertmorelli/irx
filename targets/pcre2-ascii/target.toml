# irx target: PCRE2 10.49 without UCP
# Run: tools/irx_target.py pcre2-ascii [--duration SECONDS]

[target]
title = "PCRE2 10.49 without UCP"
kind = "shell"   # d8 | perl | shell
command = "{root}/hosts/bin/pcre2_host {mode}"
env = "IRX_PCRE2_NOUCP=1"   # set for irx and the engine processes (tools/irx_target.py)
dialect = "pcre2-ascii"   # src/dialects/
selfcheck = true

[span]
enabled = true
units = "utf8"  # index unit of the host's reported spans

[capture]
enabled = true
loop = "keep"  # loop bodies' captures per iteration (docs/phase2-captures.md)
lookbehind = false  # lookbehind runs forward here; JS (and the model) match it right to left

[offset]
enabled = true  # span of a search from a start offset (lastIndex / pos / start offset)
sticky = true
