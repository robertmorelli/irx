# irx target: java.util.regex
# Run: tools/irx_target.py java [--duration SECONDS]

[target]
title = "java.util.regex"
kind = "shell"   # d8 | perl | shell
command = "/opt/homebrew/opt/openjdk/bin/java -cp {root}/hosts/bin/java Host {mode}"
dialect = "java"   # src/dialects/
selfcheck = true

[span]
enabled = true
units = "utf16"  # index unit of the host's reported spans

[capture]
enabled = true
loop = "keep"  # loop bodies' captures per iteration (docs/phase2-captures.md)
lookbehind = false  # Java tries lookbehind lengths shortest-first

[offset]
enabled = true  # span of a search from a start offset (lastIndex / pos / start offset)
sticky = true
