# irx target: Racket #px
# Run: tools/irx_target.py racket [--duration SECONDS]

[target]
title = "Racket #px"
kind = "shell"   # d8 | perl | shell
command = "/opt/homebrew/bin/racket {root}/hosts/racket/host.rkt {mode}"
dialect = "racket"   # src/dialects/
selfcheck = true

[span]
enabled = true
units = "cp"  # index unit of the host's reported spans

[capture]
enabled = true
loop = "keep"  # loop bodies' captures per iteration (docs/phase2-captures.md)
lookbehind = false  # lookbehind runs forward here; JS (and the model) match it right to left
