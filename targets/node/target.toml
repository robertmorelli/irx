# irx target: V8 14.1 (Node 25.8) - older V8, excluded from the ledger
# Run: tools/irx_target.py node [--duration SECONDS]

[target]
title = "V8 14.1 (Node 25.8) - older V8, excluded from the ledger"
kind = "shell"   # d8 | perl | shell
command = "/usr/local/bin/node {driver} {mode}"
dialect = "es"   # src/dialects/
selfcheck = true

[span]
enabled = true
units = "utf16"  # index unit of the host's reported spans

[capture]
enabled = true
loop = "reset"  # loop bodies' captures per iteration (docs/phase2-captures.md)
