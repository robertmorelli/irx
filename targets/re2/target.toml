# irx target: RE2
# Run: tools/irx_target.py re2 [--duration SECONDS]

[target]
title = "RE2"
kind = "shell"   # d8 | perl | shell
command = "{root}/hosts/bin/re2_host {mode}"
dialect = "re2"   # src/dialects/
selfcheck = true

[span]
enabled = true
units = "utf8"  # index unit of the host's reported spans

[capture]
enabled = true
loop = "keep"  # loop bodies' captures per iteration (docs/phase2-captures.md)
lookbehind = false  # lookbehind runs forward here; JS (and the model) match it right to left

[offset]
enabled = true  # span of a search from a start offset (lastIndex / pos / start offset)
