# irx target: RE2
# Run: tools/irx_target.py re2 [--duration SECONDS]

[target]
title = "RE2"
kind = "shell"   # d8 | perl | shell
command = "{root}/hosts/bin/re2_host {mode}"
dialect = "perl"   # src/dialects/
selfcheck = true

# config overlay (merged over weights.toml)
[weights]
lookahead = 0
neg_lookahead = 0
lookbehind = 0
neg_lookbehind = 0
