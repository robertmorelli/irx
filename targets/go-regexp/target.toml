# irx target: Go regexp
# Run: tools/irx_target.py go-regexp [--duration SECONDS]

[target]
title = "Go regexp"
kind = "shell"   # d8 | perl | shell
command = "{root}/hosts/bin/go_host {mode}"
dialect = "perl"   # src/dialects/
selfcheck = true

# config overlay (merged over weights.toml)
[weights]
lookahead = 0
neg_lookahead = 0
lookbehind = 0
neg_lookbehind = 0
