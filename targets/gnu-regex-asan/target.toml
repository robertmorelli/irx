# irx target: GNU regex, gawk copy (ASan/UBSan)
# Run: tools/irx_target.py gnu-regex-asan [--duration SECONDS]

[target]
title = "GNU regex, gawk copy (ASan/UBSan)"
kind = "shell"   # d8 | perl | shell
command = "{root}/hosts/bin/gnu_regex_host_asan {mode}"
env = "ASAN_OPTIONS=abort_on_error=1:halt_on_error=1:detect_leaks=0 UBSAN_OPTIONS=halt_on_error=1:abort_on_error=1:print_stacktrace=1"
dialect = "gnu"   # src/dialects/
selfcheck = true

[span]
enabled = true
units = "utf8"  # index unit of the host's reported spans

[flags]
# gawk's copy handles REG_ICASE its own way ([a-c] matches "A" but not "a"): no i sets.
sets = ["", "m", "s", "ms", "u", "mu", "su", "msu"]

[harness]
# Sanitized builds run 2-5x slower.
batch_deadline_per512_ms = 8000
